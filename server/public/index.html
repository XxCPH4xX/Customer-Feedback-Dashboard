<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Feedback Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header class="dashboard-header">
    <h1>Customer Feedback Dashboard</h1>
  </header>

  <main class="dashboard-grid">

    <section class="card feedback-form-card">
      <h2>Submit Feedback</h2>
      <form id="feedback-form">
        <div class="form-group">
          <label for="feedback-text">Your Feedback</label>
          <textarea id="feedback-text" rows="4" maxlength="5000" placeholder="Tell us about your experience..." required></textarea>
        </div>
        <div class="form-group">
          <label for="feedback-rating">Rating</label>
          <select id="feedback-rating" required>
            <option value="">Select rating</option>
            <option value="1">1 - Poor</option>
            <option value="2">2 - Fair</option>
            <option value="3">3 - Good</option>
            <option value="4">4 - Very Good</option>
            <option value="5">5 - Excellent</option>
          </select>
        </div>
        <button type="submit" id="feedback-submit">Submit Feedback</button>
        <div id="form-status" class="form-status" role="status"></div>
      </form>
    </section>

    <section class="card analytics-card">
      <h2>Analytics Overview</h2>
      <div id="stats-container">
        <div class="stat">
          <span class="stat-value" id="total-feedback">—</span>
          <span class="stat-label">Total Feedback</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="average-rating">—</span>
          <span class="stat-label">Average Rating</span>
        </div>
      </div>

      <p id="analytics-status" role="status"></p>
      <div class="charts-row">
        <div class="chart-wrapper">
          <canvas id="rating-chart"></canvas>
        </div>
        <div class="chart-wrapper">
          <canvas id="sentiment-chart"></canvas>
        </div>
      </div>
    </section>

    <section class="card feedback-list-card">
      <h2>Recent Feedback</h2>
      <div id="feedback-list" class="feedback-list"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
